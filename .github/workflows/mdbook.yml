# Build the mdBook site and deploy it to GitHub Pages.
#
# This is GitHub's starter workflow with one change: mdBook is installed
# from its prebuilt release binary instead of `cargo install`, which
# compiled it from source and took minutes on every run.
name: Deploy mdBook site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with the version you build with locally — the theme's
      # type scale and chart sizing were verified against this one.
      MDBOOK_VERSION: 0.4.52
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
          mdbook --version
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Regenerate sitemap
        run: python3 pipeline/make_sitemap.py
      - name: Build with mdBook
        run: mdbook build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # ⚠ A red X on this job does NOT mean the site failed to deploy.
      #
      # Since 2026-08-06 Pages takes longer than ten minutes to finish a
      # deployment. `actions/deploy-pages` gives up at exactly 600s,
      # cancels, and reports failure, and then the content shows up
      # anyway a few minutes later. Every deploy that day was marked
      # failed and every one of them published.
      #
      # So: check the site before believing the run.
      #
      #   curl -sI https://derivingsystems.com/<page>.html | head -1
      #
      # `timeout: 1800000` was tried here and REMOVED because it does
      # nothing. The input exists and is documented, the log echoes it
      # back, and the action still aborts at 600s on the dot. Do not
      # re-add it thinking it will help.
      #
      # Which stall you have, when it does genuinely fail, is worth
      # knowing, and the two look identical from the run list:
      #
      #   gh run view --job=<deploy job id> --log \
      #     | grep -oE "Current status: [a-z_]+" | sort | uniq -c
      #
      # `deployment_in_progress` means Pages is working and slow, and
      # the content will probably land. `deployment_queued` means it was
      # never picked up, and nothing will land.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
