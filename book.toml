[book]
title = "Deriving Systems"
description = "Performance engineering from first principles. Numbers, ratios, and the questions that split them."
authors = ["Venugopalan Iyengar"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "light"
no-section-label = false
additional-css = ["theme/custom.css"]
git-repository-url = ""
edit-url-template = ""

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
boost-title = 3
boost-hierarchy = 2

[output.html.print]
enable = true
